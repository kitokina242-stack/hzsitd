<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3D Test</title>
  <style>
    body { margin: 0; background: #111; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
    canvas { width: 400px; height: 400px; }
    #info { position: absolute; top: 10px; color: white; font-family: sans-serif; }
  </style>
  <script>
    (function () {
      var w = window.innerWidth;
      var h = window.innerHeight;
      var isLandscapePhone = (h <= 500 && w <= 950 && window.matchMedia && window.matchMedia('(orientation: landscape)').matches);
      var isPortraitPhone = (w < 768);
      var ua = navigator.userAgent || '';
      var isTablet = /iPad|Tablet|PlayBook|Silk/i.test(ua) || (w >= 768 && h >= 501);
      var isPhone = !isTablet && (isPortraitPhone || isLandscapePhone || /iPhone|iPod|Android.*Mobile|Windows Phone|BlackBerry/i.test(ua));
      if (isPhone) {
        window.location.replace('index.html');
      }
    })();
  </script>
</head>
<body>
  <div id="info">Loading bezabih.glb...</div>
  <canvas id="c"></canvas>
  <script src="../assets/libs/three/three.min.js"></script>
  <script src="../assets/libs/three/GLTFLoader.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const info = document.getElementById('info');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(400, 400);
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0, 3.2);

    const ambient = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambient);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight1.position.set(5, 8, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xc1ff72, 1.0);
    dirLight2.position.set(-5, -3, -2);
    scene.add(dirLight2);

    let model = null;
    const loader = new THREE.GLTFLoader();
    loader.load('../assets/bezabih.glb', function(gltf) {
      info.textContent = 'Loaded successfully!';
      model = gltf.scene;

      // Center the model
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 1.8 / maxDim;
      model.scale.setScalar(scale);
      model.position.sub(center.multiplyScalar(scale));

      scene.add(model);
    }, undefined, function(err) {
      info.textContent = 'Error: ' + err;
    });

    function animate() {
      requestAnimationFrame(animate);
      if (model) {
        model.rotation.y += 0.01;
      }
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
