<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Original bezabih.glb Color Test</title>
  <style>
    body { margin: 0; background: #222; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: white; }
    canvas { width: 500px; height: 500px; }
    #status { position: absolute; top: 10px; }
  </style>
</head>
<body>
  <div id="status">Loading original bezabih.glb...</div>
  <canvas id="c"></canvas>
  <script src="../assets/libs/three/three.min.js"></script>
  <script src="../assets/libs/three/GLTFLoader.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(500, 500);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0, 3.5);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(5, 5, 5);
    scene.add(dir);

    const loader = new THREE.GLTFLoader();
    loader.load('../assets/bezabih.glb', function(gltf) {
      document.getElementById('status').textContent = 'Original bezabih.glb loaded!';
      const model = gltf.scene;

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const scale = 2.0 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(scale);
      model.position.sub(center.multiplyScalar(scale));

      scene.add(model);

      function loop() {
        requestAnimationFrame(loop);
        model.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      loop();
    }, undefined, function(err) {
      document.getElementById('status').textContent = 'Error: ' + err;
    });
  </script>
</body>
</html>
