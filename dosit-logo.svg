<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="100%" height="100%">
  <defs>
    <!-- Cyan Typography Gradient -->
    <linearGradient id="dositCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BAF2" />
      <stop offset="100%" stop-color="#0084C9" />
    </linearGradient>

    <!-- Gear Gold Gradient -->
    <linearGradient id="gearGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B562" />
      <stop offset="50%" stop-color="#CCA047" />
      <stop offset="100%" stop-color="#B28532" />
    </linearGradient>

    <!-- Sun Radial Gradient -->
    <radialGradient id="sunOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA834" />
      <stop offset="70%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#D86000" />
    </radialGradient>

    <!-- IT Blue Core Gradient -->
    <linearGradient id="binaryBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5DA3" />
      <stop offset="100%" stop-color="#0F3868" />
    </linearGradient>

    <!-- Leaf Multi-shade Gradients -->
    <linearGradient id="leafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E7A2E" />
      <stop offset="100%" stop-color="#114C1C" />
    </linearGradient>

    <linearGradient id="leafMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>

    <linearGradient id="leafLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0CA33" />
      <stop offset="50%" stop-color="#9CCC65" />
      <stop offset="100%" stop-color="#7CB342" />
    </linearGradient>

    <!-- Soft Drop Shadow for Emblem Layers -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.35" />
    </filter>

    <!-- Clip Path for Circular Center Core -->
    <clipPath id="innerCoreClip">
      <circle cx="330" cy="210" r="78" />
    </clipPath>
  </defs>

  <!-- ================= TYPOGRAPHY: DoSIT ================= -->
  <g id="typography" fill="url(#dositCyan)">
    <!-- Letter 'D' -->
    <path d="M 22 25 L 22 90 L 54 90 C 76 90 92 76 92 57.5 C 92 39 76 25 54 25 Z M 36 38 L 51 38 C 66 38 76 46 76 57.5 C 76 69 66 77 51 77 L 36 77 Z" />
    
    <!-- Letter 'O' -->
    <path d="M 124 25 C 103 25 90 39 90 57.5 C 90 76 103 90 124 90 C 145 90 158 76 158 57.5 C 158 39 145 25 124 25 Z M 124 38 C 137 38 143 46.5 143 57.5 C 143 68.5 137 77 124 77 C 111 77 105 68.5 105 57.5 C 105 46.5 111 38 124 38 Z" />

    <!-- Letter 'S' -->
    <path d="M 206 38 C 201 30 192 25 181 25 C 168 25 159 32 159 42 C 159 51 168 56 182 60 L 187 61 C 203 66 212 72 212 83 C 212 95 199 101 183 101 C 170 101 159 96 151 86 L 161 76 C 167 83 175 87 183 87 C 192 87 198 83 198 77 C 198 70 191 66 178 62 L 173 60 C 157 55 147 49 147 38 C 147 26 159 15 180 15 C 192 15 202 20 210 28 Z" />

    <!-- Letter 'i' + Wi-Fi Broadcast Waves -->
    <g id="letter_i">
      <!-- 'i' vertical stem -->
      <rect x="226" y="44" width="13" height="46" rx="2" />
      <!-- Base dot -->
      <circle cx="232.5" cy="33" r="3.5" />
      <!-- Concentric broadcast signal waves -->
      <path d="M 223 25 A 11 11 0 0 1 242 25" fill="none" stroke="#00BAF2" stroke-width="3" stroke-linecap="round" />
      <path d="M 217 17 A 18 18 0 0 1 248 17" fill="none" stroke="#00BAF2" stroke-width="3.2" stroke-linecap="round" />
      <path d="M 211 9 A 25 25 0 0 1 254 9" fill="none" stroke="#00BAF2" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Letter 'T' with modern techno cut -->
    <path d="M 260 35 L 260 47 L 275 47 L 275 90 L 289 90 L 289 47 L 304 47 L 310 35 Z" />
  </g>

  <!-- ================= EMBLEM EMBODYING SCIENCE & TECH ================= -->
  <g id="emblemCore">
    
    <!-- 1. MECHANICAL COG / GEAR -->
    <g id="gearWheel">
      <!-- Outer 16-toothed Industrial Gear -->
      <path d="
        M 330 85
        L 343 85 L 346 98 L 360 102 L 370 93 L 382 99 L 379 113 L 391 121 L 404 116 L 411 126 L 402 137 L 410 150 L 425 151 L 428 164 L 416 172 L 420 186 L 435 191 L 434 205 L 419 209 L 415 223 L 426 233 L 420 245 L 406 244 L 398 256 L 405 269 L 395 278 L 382 272 L 370 281 L 372 296 L 360 300 L 350 290 L 336 293 L 332 308 L 319 308 L 315 293 L 301 290 L 291 300 L 279 296 L 281 281 L 269 272 L 256 278 L 246 269 L 253 256 L 245 244 L 231 245 L 225 233 L 236 223 L 232 209 L 217 205 L 216 191 L 231 186 L 235 172 L 223 164 L 226 151 L 241 150 L 249 137 L 240 126 L 247 116 L 260 121 L 272 113 L 269 99 L 281 93 L 291 102 L 305 98 L 308 85 Z
      " fill="url(#gearGold)" stroke="#7A4E0E" stroke-width="2.5" stroke-linejoin="round" />
      <circle cx="330" cy="210" r="80" fill="none" stroke="#7A4E0E" stroke-width="3" />
    </g>

    <!-- 2. INNER DIGITAL IT PORTAL (CLIPPED INSIDE GEAR CORE) -->
    <g id="digitalPortal" clip-path="url(#innerCoreClip)">
      <!-- Royal Blue Digital Space -->
      <rect x="230" y="110" width="200" height="200" fill="url(#binaryBlue)" />

      <!-- RADIANT RISING SUN -->
      <g id="risingSun">
        <circle cx="340" cy="190" r="34" fill="url(#sunOrange)" stroke="#D86000" stroke-width="1.5" />
        <!-- Sharp Solar Rays -->
        <g fill="#FFA834" stroke="#D86000" stroke-width="1">
          <polygon points="340,144 335,157 345,157" />
          <polygon points="365,150 354,161 362,167" />
          <polygon points="380,171 366,177 372,185" />
          <polygon points="384,195 369,197 371,206" />
          <polygon points="315,150 318,161 326,161" />
          <polygon points="300,171 308,177 314,171" />
        </g>
      </g>

      <!-- BINARY CODE DATA MATRIX -->
      <g id="binaryMatrix" font-family="'Courier New', Courier, monospace" font-weight="900" font-size="22" fill="#FFFFFF" opacity="0.95" letter-spacing="4">
        <text x="260" y="165">1 0 0</text>
        <text x="272" y="200">0 1 0 1</text>
        <text x="256" y="235">1 0 0 1</text>
        <text x="268" y="270">0 1 1 0</text>
      </g>
    </g>

    <!-- 3. AGRICULTURAL / ECOLOGICAL GREEN LEAF SWOOSH -->
    <g id="greenLeafSwoosh" filter="url(#softShadow)">
      <!-- Outer Dark Green Contour Band -->
      <path d="
        M 262 78
        C 225 118 188 180 188 245
        C 188 310 226 355 295 385
        C 273 358 258 320 258 280
        C 258 208 295 165 342 140
        C 300 120 275 100 262 78 Z
      " fill="url(#leafDark)" stroke="#0E3D17" stroke-width="2.5" />

      <!-- Middle Emerald Green Contour Band -->
      <path d="
        M 262 78
        C 220 142 198 205 198 258
        C 198 322 250 372 310 388
        C 283 358 263 315 263 270
        C 263 198 305 152 342 140
        C 305 120 278 100 262 78 Z
      " fill="url(#leafMid)" stroke="#165B23" stroke-width="1.8" />

      <!-- Inner Lime-Yellow Contour Band -->
      <path d="
        M 262 78
        C 235 142 215 210 220 268
        C 225 328 268 372 328 390
        C 300 362 284 325 284 285
        C 284 222 316 178 342 140
        C 305 118 280 96 262 78 Z
      " fill="url(#leafLime)" stroke="#4A7513" stroke-width="1.5" />
    </g>

    <!-- 4. ATOMIC SCIENCE ORBIT & ELECTRON -->
    <g id="atomicOrbit">
      <!-- 3D Tilted Elliptical Orbit Track -->
      <path d="M 145 315 C 95 380 65 345 120 280 C 185 195 330 100 455 85 C 525 75 555 120 490 195 C 405 290 230 395 145 315 Z" 
            fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Inner Glow / Metallic Shimmer Line -->
      <path d="M 145 315 C 95 380 65 345 120 280 C 185 195 330 100 455 85 C 525 75 555 120 490 195 C 405 290 230 395 145 315 Z" 
            fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.4" />

      <!-- Revolving Orbit Electron Particle -->
      <circle cx="496" cy="165" r="14" fill="#0B132B" stroke="#38BDF8" stroke-width="2.5" />
      <!-- Particle Core Highlight -->
      <circle cx="493" cy="161" r="3.5" fill="#E0F2FE" />
    </g>

  </g>
</svg>
